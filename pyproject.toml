[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hindi-english-codemix-nlp"
version = "0.1.0"
description = "Research starter toolkit for Hindi-English code-mixed NLP"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
